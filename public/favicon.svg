<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Rich 24K Dental Gold Gradient -->
    <linearGradient id="kush-gold" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFF0B8" />
      <stop offset="25%" stop-color="#F5D268" />
      <stop offset="60%" stop-color="#DCA51B" />
      <stop offset="100%" stop-color="#AF7A08" />
    </linearGradient>
    <!-- Obsidian Luxury Badge Background -->
    <linearGradient id="badge-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2025" />
      <stop offset="50%" stop-color="#141518" />
      <stop offset="100%" stop-color="#0B0C0E" />
    </linearGradient>
    <!-- Fine Gold Metallic Border -->
    <linearGradient id="badge-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAD97A" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#DCA51B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#9E6F06" stop-opacity="0.85" />
    </linearGradient>
    <!-- Subtle Inner Glow Filter -->
    <filter id="gold-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#DCA51B" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Luxury Obsidian Squircle Container: Ensures 100% Visibility on BOTH Light & Dark Browser Tabs -->
  <rect x="16" y="16" width="480" height="480" rx="124" fill="url(#badge-bg)" stroke="url(#badge-border)" stroke-width="14" />

