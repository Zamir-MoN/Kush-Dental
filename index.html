<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta id="viewport-meta" name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <script>
    (function () {
      var targetWidth = 768;
      var deviceWidth = Math.min(window.screen.width, window.screen.height);
      if (deviceWidth > 0 && deviceWidth < targetWidth) {
        var scale = (deviceWidth / targetWidth).toFixed(4);
        var meta = document.getElementById('viewport-meta');
        if (meta) {
          meta.setAttribute('content', 'width=' + targetWidth + ', initial-scale=' + scale + ', maximum-scale=3.0');
        }
      }
    })();
  </script>
  <meta name="description" content="Kush Dental Clinic - Precision Dentistry. Excellence in Every Smile." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,700&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Syne:wght@600;700;800;900&family=Cabinet+Grotesk:wght@700;800;900&display=swap"
    rel="stylesheet">
  <title>Kush Dental Clinic</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
